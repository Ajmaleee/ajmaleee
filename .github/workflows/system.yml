name: system

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/github_data.py"
      - "tools/generate_stats.py"
      - ".github/workflows/system.yml"

permissions:
  contents: write

concurrency:
  group: system-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public profile data
        run: python tools/github_data.py

      - name: Render system panels
        run: python tools/generate_stats.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data_cache.json assets/generated/system-dark.svg assets/generated/system-light.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh system stats"
            git push
          fi
